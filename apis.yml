description: 'RetailMeNot is a consumer savings destination that aggregates coupons, promo
  codes, cash-back offers, and deals from thousands of retailers and brands, helping shoppers
  in the United States save money when they buy online and in-store. It operates a website,
  mobile apps, and browser extensions that surface verified discount codes and cash-back at
  checkout, and it monetizes through retailer affiliate relationships rather than a self-serve
  developer platform. As of this profile RetailMeNot publishes no public developer API, OpenAPI,
  or documentation surface; probing found no reachable developer portal or well-known discovery
  documents, and partner activity is handled through whitelabel affiliate infrastructure.'
